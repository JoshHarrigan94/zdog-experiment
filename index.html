<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Project Jive — a tiny behaviour engine for living digital companions."
  />

  <title>Project Jive</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/zdog@1/dist/zdog.dist.min.js" defer></script>
<script src="jive.js" defer></script>
<script src="raisinRenderer.js" defer></script>
<script src="app.js" defer></script>
</head>

<body>
  <main class="app-shell">
    <section class="hero-panel">
      <div class="status-row">
        <span class="status-dot"></span>
        <span id="engine-status">Jive engine waking up…</span>
      </div>

      <section class="stage-card" aria-label="Companion stage">
        <div id="companion-stage" class="companion-stage">
          <div class="companion-placeholder">
            <div class="companion-orb"></div>
            <p>Raisin is not rendered yet.</p>
            <span>Prompt 1 is engine-only.</span>
          </div>
        </div>
      </section>

      <section class="mood-card">
        <p class="eyebrow">Current state</p>
        <h1 id="current-emotion">Dormant</h1>
        <p id="current-thought">
          Waiting for the simulation loop to start.
        </p>
      </section>
    </section>

    <section class="debug-panel" aria-label="Jive engine debug panel">
      <div class="panel-header">
        <div>
          <p class="eyebrow">Jive Core</p>
          <h2>Behaviour Engine</h2>
        </div>

        <button id="tick-button" type="button">
          Manual tick
        </button>
      </div>

      <div class="metrics-grid">
        <article class="metric-card">
          <span>Energy</span>
          <strong id="metric-energy">--</strong>
        </article>

        <article class="metric-card">
          <span>Curiosity</span>
          <strong id="metric-curiosity">--</strong>
        </article>

        <article class="metric-card">
          <span>Affection</span>
          <strong id="metric-affection">--</strong>
        </article>

        <article class="metric-card">
          <span>Comfort</span>
          <strong id="metric-comfort">--</strong>
        </article>
      </div>

      <div class="log-card">
        <div class="log-header">
          <span>Event stream</span>
          <button id="clear-log-button" type="button">
            Clear
          </button>
        </div>

        <ol id="event-log" class="event-log">
          <li>Waiting for app.js…</li>
        </ol>
      </div>
    </section>
  </main>
</body>
</html>
